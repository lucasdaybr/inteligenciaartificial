<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>Você decide o futuro da IA</title>

</head>


<body>

    <main class="caixa-principal">

        <div class="detalhe-topo"></div>


        <header class="cabecalho">

            <div class="logo">
                IA<span>.</span>
            </div>

            <div class="identificacao">
                EXPERIÊNCIA INTERATIVA
            </div>

        </header>


        <section class="capa">

            <div class="numero-capa">
                01
            </div>

            <div>

                <p class="categoria">
                    TECNOLOGIA • FUTURO • HUMANIDADE
                </p>

                <h1>
                    Você decide
                    <br>
                    <span>o futuro da IA</span>
                </h1>

                <p class="descricao">
                    Cinco perguntas.
                    Cinco escolhas.
                    Um futuro construído por você.
                </p>

                <div class="linha"></div>

            </div>

        </section>


        <section class="quiz">

            <div class="cabecalho-quiz">

                <div>

                    <span class="label">
                        SUA JORNADA
                    </span>

                </div>

                <div class="contador">
                    01 / 05
                </div>

            </div>


            <div class="progresso">

                <div class="progresso-atual"></div>

            </div>


            <div class="caixa-perguntas"></div>


            <div class="caixa-alternativas"></div>


            <div class="rodape">

                <span>
                    ESCOLHA UMA ALTERNATIVA
                </span>

                <span>
                    IA / 2049
                </span>

            </div>

        </section>


        <section class="caixa-resultado">

            <div class="resultado-numero">
                2049
            </div>

            <div class="resultado-conteudo">

                <p class="label-resultado">
                    SUA HISTÓRIA
                </p>

                <h2>
                    Em 2049...
                </h2>

                <p class="texto-resultado"></p>

                <button
                    class="botao-novamente"
                    onclick="location.reload()"
                >
                    ↻ JOGAR NOVAMENTE
                </button>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
